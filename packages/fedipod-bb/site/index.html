<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FediPod-BB</title>
<style>
  :root { color-scheme: light dark; --line:#d9d4c7; --dim:#5a584f; --accent:#6a8a5a; --paper:rgba(120,120,120,.08); }
  @media (prefers-color-scheme: dark) { :root { --dim:#c2c0b4; --line:#3a3a36; } }
  body { font: 18px/1.55 system-ui, sans-serif; max-width: 46rem; margin: 1.5rem auto; padding: 0 1rem; }
  header.top { display: flex; gap: 1rem; align-items: baseline; flex-wrap: wrap; border-bottom: 1px solid var(--line); padding-bottom: .6rem; margin-bottom: 1rem; }
  header.top h1 { font-size: 1.35rem; margin: 0; }
  header.top a { color: inherit; text-decoration: none; }
  nav.crumbs { color: var(--dim); font-size: .95rem; margin: 0 0 1rem; }
  nav.crumbs a { color: inherit; }
  .dim { color: var(--dim); }
  .hint { color: var(--dim); font-size: .95rem; }
  ul.list { list-style: none; padding: 0; margin: 0; }
  ul.list li { padding: .7rem 0; border-bottom: 1px solid var(--line); }
  ul.list li a.title { font-weight: 600; text-decoration: none; color: inherit; }
  ul.list li .meta { color: var(--dim); font-size: .9rem; }
  article.post { padding: .9rem 0; border-bottom: 1px solid var(--line); }
  article.post .who { color: var(--dim); font-size: .9rem; display: flex; gap: .6rem; flex-wrap: wrap; }
  article.post .who b { color: inherit; }
  article.post .body { margin-top: .3rem; overflow-wrap: anywhere; }
  article.post.waiting { background: var(--paper); border-radius: 10px; padding: .9rem 1rem; }
  article.post.gone .body { color: var(--dim); font-style: italic; }
  section.reply { margin-top: 1.5rem; padding: 1rem 1.1rem; background: var(--paper); border-radius: 12px; }
  section.reply h2 { font-size: 1.1rem; margin: 0 0 .5rem; }
  textarea { width: 100%; min-height: 6rem; font: inherit; padding: .5rem .6rem; box-sizing: border-box; border: 1px solid var(--line); border-radius: 8px; }
  input[type=text] { font: inherit; padding: .45rem .6rem; border: 1px solid var(--line); border-radius: 8px; width: 16rem; max-width: 100%; }
  button { font: inherit; padding: .5rem 1rem; border-radius: 9px; border: 1px solid var(--line); background: transparent; color: inherit; cursor: pointer; }
  button.primary { background: var(--accent); color: #fff; border-color: transparent; }
  button[disabled] { opacity: .5; cursor: not-allowed; }
  .row { display: flex; gap: .6rem; align-items: center; flex-wrap: wrap; margin: .5rem 0; }
  .err { color: #b00020; }
  @media (prefers-color-scheme: dark) { .err { color: #ff8a80; } }
  .err:empty { display: none; }
  [hidden] { display: none !important; }
  code { background: var(--paper); padding: .05em .35em; border-radius: 4px; }
  p.empty { color: var(--dim); }
</style>
</head>
<body>
<header class="top">
  <h1><a id="forum-link" href="#/">Forum</a></h1>
  <span class="dim" id="forum-status"></span>
</header>
<nav class="crumbs" id="crumbs"></nav>
<main id="main">
  <p class="dim">Loading…</p>
</main>
<section class="reply" id="reply" hidden>
  <h2 id="reply-title">Reply</h2>
  <div id="reply-signed-out">
    <p class="hint">Replies are posts from your own account. Sign in once with a Mastodon account, or post from
      your FediPod account by mentioning <code id="reply-handle"></code>.</p>
    <div class="row">
      <label for="masto-host">Your Mastodon server</label>
      <input type="text" id="masto-host" placeholder="mastodon.social" autocomplete="off">
      <button id="masto-login">Sign in with Mastodon</button>
    </div>
    <div class="row">
      <a id="fedipod-open" href="/app/">Open FediPod</a>
      <span class="dim">·</span>
      <a id="fedipod-signup" href="/new-account">Get a FediPod account</a>
    </div>
  </div>
  <div id="reply-signed-in" hidden>
    <p class="hint">Posting as <b id="reply-as"></b>. Your reply goes out from your server; it shows here once the forum has placed it.
      <button id="masto-logout" class="link">Sign out</button></p>
    <textarea id="reply-text" placeholder="Write your reply"></textarea>
    <div class="row">
      <button id="reply-send" class="primary">Post reply</button>
      <span class="hint" id="reply-note"></span>
    </div>
  </div>
  <p class="err" id="reply-err" role="alert"></p>
</section>
<script type="module" src="/bb/bb.js"></script>
</body>
</html>
