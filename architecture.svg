<svg xmlns="http://www.w3.org/2000/svg" width="820" height="550" viewBox="0 0 820 550" role="img" aria-labelledby="ttl dsc">
<title id="ttl">Solid ActivityPub — the two halves of an ActivityPub server</title>
<desc id="dsc">An ActivityPub server split in two. The pod is the discovery and storage part and may be local or remote: webfinger and host-meta, the actor document and public key, a public-append inbox, the outbox with followers and notes, and private trees. The agent is the behavior part and is always local: it publishes those documents, collects and verifies the inbox, delivers signed activities, looks up handles by webfinger, and serves a local web UI. Only remote servers write into the inbox. AP_HOME holds the credential and private key and is never uploaded. Your browser accesses the agent's UI and is the only thing that connects to it.</desc>
<style>
  text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; }
  .t  { font-size: 14px; font-weight: 400; }
  .th { font-size: 14px; font-weight: 500; }
  .ts { font-size: 12px; font-weight: 400; }
  .teal   { fill: #E1F5EE; stroke: #0F6E56; }
  .purple { fill: #EEEDFE; stroke: #534AB7; }
  .gray   { fill: #F1EFE8; stroke: #5F5E5A; }
  .coral  { fill: #FAECE7; stroke: #993C1D; }
  .box    { fill: #FFFFFF; stroke: #B4B2A9; }
  .tealtx   { fill: #085041; }
  .purpletx { fill: #3C3489; }
  .graytx   { fill: #444441; }
  .coraltx  { fill: #712B13; }
  .boxtx    { fill: #2C2C2A; }
  .arr { stroke: #5F5E5A; stroke-width: 1.5; fill: none; stroke-linecap: round; }
  @media (prefers-color-scheme: dark) {
    .teal   { fill: #085041; stroke: #5DCAA5; }
    .purple { fill: #3C3489; stroke: #AFA9EC; }
    .gray   { fill: #444441; stroke: #B4B2A9; }
    .coral  { fill: #712B13; stroke: #F0997B; }
    .box    { fill: #2C2C2A; stroke: #5F5E5A; }
    .tealtx   { fill: #9FE1CB; }
    .purpletx { fill: #CECBF6; }
    .graytx   { fill: #D3D1C7; }
    .coraltx  { fill: #F5C4B3; }
    .boxtx    { fill: #F1EFE8; }
    .arr { stroke: #B4B2A9; }
  }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<rect class="gray" x="40" y="40" width="740" height="48" rx="4" stroke-width="0.5"/>
<text class="th graytx" x="56" y="62">The fediverse</text>
<text class="ts graytx" x="56" y="79">Mastodon, Lemmy, anyone else</text>

<rect class="teal" x="40" y="128" width="280" height="316" rx="8" stroke-width="0.5"/>
<text class="th tealtx" x="180" y="152" text-anchor="middle">A pod (local or remote)</text>
<text class="ts tealtx" x="180" y="170" text-anchor="middle">discovery + storage part of an AP server</text>
<rect class="box" x="56" y="190" width="248" height="42" rx="4" stroke-width="0.5"/>
<text class="t boxtx" x="70" y="216">webfinger + host-meta</text>
<rect class="box" x="56" y="240" width="248" height="42" rx="4" stroke-width="0.5"/>
<text class="t boxtx" x="70" y="266">ap/actor + public key</text>
<rect class="box" x="56" y="290" width="248" height="42" rx="4" stroke-width="0.5"/>
<text class="t boxtx" x="70" y="316">ap/inbox — public append</text>
<rect class="box" x="56" y="340" width="248" height="42" rx="4" stroke-width="0.5"/>
<text class="t boxtx" x="70" y="366">ap/outbox, followers, notes</text>
<rect class="box" x="56" y="390" width="248" height="42" rx="4" stroke-width="0.5"/>
<text class="t boxtx" x="70" y="408">fediverse/ + ap-state/</text>
<text class="ts boxtx" x="70" y="424">private to you</text>

<rect class="purple" x="500" y="128" width="280" height="316" rx="8" stroke-width="0.5"/>
<text class="th purpletx" x="640" y="152" text-anchor="middle">Solid ActivityPub (local)</text>
<text class="ts purpletx" x="640" y="170" text-anchor="middle">behavior part of an AP server</text>
<rect class="box" x="516" y="190" width="248" height="42" rx="4" stroke-width="0.5"/>
<text class="t boxtx" x="530" y="208">publish</text>
<text class="ts boxtx" x="530" y="224">webfinger, actor, outbox, notes</text>
<rect class="box" x="516" y="240" width="248" height="42" rx="4" stroke-width="0.5"/>
<text class="t boxtx" x="530" y="258">deliver</text>
<text class="ts boxtx" x="530" y="274">signs and POSTs activities</text>
<rect class="box" x="516" y="290" width="248" height="42" rx="4" stroke-width="0.5"/>
<text class="t boxtx" x="530" y="308">intake</text>
<text class="ts boxtx" x="530" y="324">collects and verifies the inbox</text>
<rect class="box" x="516" y="340" width="248" height="42" rx="4" stroke-width="0.5"/>
<text class="t boxtx" x="530" y="358">resolveHandle</text>
<text class="ts boxtx" x="530" y="374">webfinger lookups for handles</text>
<rect class="box" x="516" y="390" width="248" height="42" rx="4" stroke-width="0.5"/>
<text class="t boxtx" x="530" y="408">admin</text>
<text class="ts boxtx" x="530" y="424">serves the local web UI</text>

<line class="arr" x1="180" y1="88" x2="180" y2="126" marker-end="url(#arrow)"/>
<text class="ts graytx" x="192" y="112">fetches + delivers</text>
<line class="arr" x1="640" y1="126" x2="640" y2="88" marker-end="url(#arrow)"/>
<text class="ts graytx" x="628" y="112" text-anchor="end">delivers + looks up</text>
<text class="ts graytx" x="410" y="252" text-anchor="middle">publishes + collects</text>
<line class="arr" x1="500" y1="264" x2="322" y2="264" marker-end="url(#arrow)"/>
<text class="ts graytx" x="410" y="296" text-anchor="middle">pushes notifications</text>
<line class="arr" x1="320" y1="308" x2="498" y2="308" marker-end="url(#arrow)"/>

<rect class="coral" x="500" y="464" width="135" height="66" rx="4" stroke-width="0.5"/>
<text class="t coraltx" x="568" y="486" text-anchor="middle">AP_HOME</text>
<text class="ts coraltx" x="568" y="503" text-anchor="middle">credential + key</text>
<text class="ts coraltx" x="568" y="519" text-anchor="middle">never uploaded</text>
<rect class="gray" x="645" y="464" width="135" height="66" rx="4" stroke-width="0.5"/>
<text class="t graytx" x="713" y="486" text-anchor="middle">Your browser</text>
<text class="ts graytx" x="713" y="503" text-anchor="middle">accesses the</text>
<text class="ts graytx" x="713" y="519" text-anchor="middle">Agent's UI</text>
<line class="arr" x1="568" y1="464" x2="568" y2="445" marker-end="url(#arrow)"/>
<line class="arr" x1="713" y1="464" x2="713" y2="445" marker-end="url(#arrow)"/>
</svg>
