<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 680" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1300" height="680" fill="#ffffff"/>

  <!-- boxes (draw.io palette, as browser.svg) -->
  <g stroke-width="1.5">
    <rect x="450"  y="24"  width="280" height="84"  rx="6"  fill="#dae8fc" stroke="#6c8ebf"/>
    <rect x="260"  y="175" width="650" height="215" rx="10" fill="#f5f5f5" stroke="#666666" stroke-dasharray="8 6"/>
    <rect x="285"  y="230" width="230" height="130" rx="6"  fill="#d5e8d4" stroke="#82b366"/>
    <rect x="665"  y="230" width="230" height="130" rx="6"  fill="#e1d5e7" stroke="#9673a6"/>
    <rect x="40"   y="500" width="300" height="110" rx="6"  fill="#f8cecc" stroke="#b85450"/>
    <rect x="780"  y="500" width="300" height="110" rx="6"  fill="#fff2cc" stroke="#d6b656"/>
    <rect x="1040" y="250" width="220" height="95"  rx="6"  fill="#ffe6cc" stroke="#d79b00"/>
  </g>

  <!-- box labels -->
  <g fill="#111" text-anchor="middle">
    <text x="590" y="60"  font-size="20" font-weight="bold">Open Social Web</text>
    <text x="590" y="88"  font-size="16">Mastodon · Pixelfed · Bluesky …</text>

    <text x="280" y="206" font-size="22" font-weight="bold" text-anchor="start">FediPod</text>

    <text x="400" y="266" font-size="20" font-weight="bold">BrowserAgent</text>
    <text x="400" y="294" font-size="16">FediPod in any browser,</text>
    <text x="400" y="318" font-size="16">with Sengi or Phanpy</text>

    <text x="780" y="266" font-size="20" font-weight="bold">Gateway</text>
    <text x="780" y="294" font-size="16">at fedipod.net, keeps</text>
    <text x="780" y="318" font-size="16">your account running</text>
    <text x="780" y="342" font-size="16">from a working copy</text>

    <text x="190" y="536" font-size="20" font-weight="bold">Your Pod</text>
    <text x="190" y="564" font-size="16">your key, your posts</text>
    <text x="190" y="588" font-size="16">and your account's data</text>

    <text x="930" y="536" font-size="20" font-weight="bold">Mastodon Apps</text>
    <text x="930" y="564" font-size="16">Elk · Ivory · Tusky · Fedilab</text>
    <text x="930" y="588" font-size="16">on your phone or desktop</text>

    <text x="1150" y="289" font-size="20" font-weight="bold">C2S Apps</text>
    <text x="1150" y="317" font-size="16">box, Dokieli</text>
  </g>

  <!-- arrows -->
  <g stroke="#333" stroke-width="1.6" fill="none">
    <!-- Open Social Web <-> BrowserAgent (ATProto, Bluesky) -->
    <line x1="520" y1="108" x2="410" y2="230" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <!-- Open Social Web <-> Gateway (ActivityPub mail) -->
    <line x1="660" y1="108" x2="770" y2="230" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <!-- BrowserAgent <-> Gateway -->
    <line x1="515" y1="298" x2="665" y2="298" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <!-- Your Pod -> Open Social Web (public posts and profile) -->
    <path d="M100,500 C0,400 0,110 450,70" marker-end="url(#arrow)"/>
    <!-- BrowserAgent <-> Your Pod (Solid) -->
    <line x1="350" y1="360" x2="230" y2="500" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <!-- Gateway <-> Your Pod (stores the account's data) -->
    <line x1="720" y1="360" x2="340" y2="560" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <!-- Mastodon Apps <-> Gateway -->
    <line x1="900" y1="500" x2="840" y2="360" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <!-- C2S Apps <-> Gateway -->
    <line x1="1040" y1="298" x2="895" y2="298" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  </g>

  <!-- arrow labels -->
  <g fill="#333" font-size="16">
    <text x="470" y="140" text-anchor="end" font-weight="bold" fill="#111">ATProto Protocol</text>
    <text x="470" y="160" text-anchor="end">for Bluesky</text>

    <text x="712" y="140" text-anchor="start" font-weight="bold" fill="#111">S2S Protocol</text>
    <text x="712" y="160" text-anchor="start">mail in, posts out</text>

    <text x="590" y="286" text-anchor="middle">serves the app</text>
    <text x="590" y="320" text-anchor="middle">posts out</text>

    <text x="968" y="286" text-anchor="middle" font-weight="bold" fill="#111">C2S Protocol</text>

    <text x="85" y="250" text-anchor="start">other servers read</text>
    <text x="85" y="270" text-anchor="start">your public posts</text>
    <text x="85" y="290" text-anchor="start">and profile</text>

    <text x="272" y="420" text-anchor="end" font-weight="bold" fill="#111">Solid Protocol</text>
    <text x="272" y="440" text-anchor="end">reads &amp; writes your pod</text>

    <text x="520" y="490" text-anchor="start">stores the working copy</text>
    <text x="520" y="510" text-anchor="start">on your pod</text>

    <text x="894" y="415" text-anchor="start" font-weight="bold" fill="#111">Mastodon client API</text>
    <text x="894" y="435" text-anchor="start">sign in at fedipod.net;</text>
    <text x="894" y="455" text-anchor="start">notifications to your phone</text>
  </g>

  <text x="1260" y="660" text-anchor="end" font-size="16" fill="#555">© 2026 Jeff Zucker · CC BY-SA 4.0</text>
</svg>
