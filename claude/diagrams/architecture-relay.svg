<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<rect class="gray" x="40" y="40" width="847" height="48" rx="4" stroke-width="0.5"/>
<text class="th graytx" x="56" y="62">The fediverse</text>
<text class="ts graytx" x="56" y="79">Mastodon, Lemmy, PeerTube, anyone else</text>

<rect class="teal" x="40" y="128" width="280" height="420" rx="8" stroke-width="0.5"/>
<text class="th tealtx" x="180" y="152" text-anchor="middle">A pod — the relay</text>
<text class="ts tealtx" x="180" y="170" text-anchor="middle">what must be public, and one thing more</text>
<rect class="box" x="56" y="190" width="248" height="42" rx="4" stroke-width="0.5"/>
<text class="t boxtx" x="70" y="208">webfinger + host-meta</text>
<text class="ts boxtx" x="70" y="224">at the host root, so the handle resolves</text>
<rect class="box" x="56" y="240" width="248" height="42" rx="4" stroke-width="0.5"/>
<text class="t boxtx" x="70" y="258">actor document + public key</text>
<text class="ts boxtx" x="70" y="274">fetched to check your signatures</text>
<rect class="box" x="56" y="290" width="248" height="42" rx="4" stroke-width="0.5"/>
<text class="t boxtx" x="70" y="308">inbox — anyone may append</text>
<text class="ts boxtx" x="70" y="324">the relay: mail lands here</text>
<rect class="box" x="56" y="340" width="248" height="42" rx="4" stroke-width="0.5"/>
<text class="t boxtx" x="70" y="358">outbox, followers, following, notes</text>
<text class="ts boxtx" x="70" y="374">paged to save load on the pod host</text>
<rect class="box" x="56" y="390" width="248" height="42" rx="4" stroke-width="0.5"/>
<text class="t boxtx" x="70" y="408">media</text>
<text class="ts boxtx" x="70" y="424">attachments, so their ids resolve</text>
<rect class="box" x="56" y="440" width="248" height="42" rx="4" stroke-width="0.5"/>
<text class="t boxtx" x="70" y="458">nodeinfo</text>
<text class="ts boxtx" x="70" y="474">what a client probes when it logs in</text>
<rect class="box" x="56" y="490" width="248" height="42" rx="4" stroke-width="0.5" stroke-dasharray="3 3"/>
<text class="t boxtx" x="70" y="508">the lease — the single writer</text>
<text class="ts boxtx" x="70" y="524">stays here even when nothing else does</text>

<rect class="purple" x="500" y="128" width="280" height="374" rx="8" stroke-width="0.5"/>
<text class="th purpletx" x="640" y="152" text-anchor="middle">Solid ActivityPub (local)</text>
<text class="ts purpletx" x="640" y="170" text-anchor="middle">behavior part of an AP server</text>
<rect class="box" x="516" y="190" width="248" height="42" rx="4" stroke-width="0.5"/>
<text class="t boxtx" x="530" y="208">publish</text>
<text class="ts boxtx" x="530" y="224">keeps the public face current</text>
<rect class="box" x="516" y="240" width="248" height="42" rx="4" stroke-width="0.5"/>
<text class="t boxtx" x="530" y="258">deliver</text>
<text class="ts boxtx" x="530" y="274">signs and POSTs activities</text>
<rect class="box" x="516" y="290" width="248" height="42" rx="4" stroke-width="0.5"/>
<text class="t boxtx" x="530" y="308">intake</text>
<text class="ts boxtx" x="530" y="324">collects and verifies the inbox</text>
<rect class="box" x="516" y="340" width="248" height="42" rx="4" stroke-width="0.5"/>
<text class="t boxtx" x="530" y="358">resolveHandle</text>
<text class="ts boxtx" x="530" y="374">webfinger lookups for handles</text>
<rect class="box" x="516" y="390" width="248" height="42" rx="4" stroke-width="0.5"/>
<text class="t boxtx" x="530" y="408">tag feed</text>
<text class="ts boxtx" x="530" y="424">public hashtags, never touches the pod</text>
<rect class="box" x="516" y="440" width="248" height="46" rx="4" stroke-width="0.5"/>
<text class="t boxtx" x="530" y="458">client API + web UI</text>
<text class="ts boxtx" x="530" y="474">Mastodon-compatible, a client built in</text>

<line class="arr" x1="180" y1="88" x2="180" y2="126" marker-end="url(#arrow)"/>
<text class="ts graytx" x="192" y="112">fetches + delivers</text>
<line class="arr" x1="640" y1="126" x2="640" y2="88" marker-end="url(#arrow)"/>
<text class="ts graytx" x="628" y="112" text-anchor="end">delivers + looks up</text>
<text class="ts graytx" x="410" y="252" text-anchor="middle">publishes + drains</text>
<line class="arr" x1="500" y1="264" x2="322" y2="264" marker-end="url(#arrow)"/>
<text class="ts graytx" x="410" y="296" text-anchor="middle">pushes notifications</text>
<line class="arr" x1="320" y1="308" x2="498" y2="308" marker-end="url(#arrow)"/>

<rect class="coral" x="393" y="560" width="250" height="94" rx="8" stroke-width="0.5"/>
<text class="th coraltx" x="518" y="584" text-anchor="middle">A local pod or directory</text>
<text class="ts coraltx" x="518" y="606" text-anchor="middle">notes, timeline, contacts, blocklist,</text>
<text class="ts coraltx" x="518" y="622" text-anchor="middle">client tokens, Solid credential,</text>
<text class="ts coraltx" x="518" y="638" text-anchor="middle">Fediverse signing key</text>
<line class="arr" x1="518" y1="560" x2="518" y2="503" marker-end="url(#arrow)"/>
<rect class="gray" x="667" y="560" width="220" height="64" rx="8" stroke-width="0.5"/>
<text class="th graytx" x="777" y="584" text-anchor="middle">Your browser</text>
<text class="ts graytx" x="777" y="606" text-anchor="middle">the client and the admin page</text>
<line class="arr" x1="777" y1="560" x2="777" y2="503" marker-end="url(#arrow)"/>
</svg>
