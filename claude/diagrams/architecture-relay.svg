<svg xmlns="http://www.w3.org/2000/svg" width="930" height="674" viewBox="0 0 930 674" role="img" aria-labelledby="ttl dsc">
<title id="ttl">Solid ActivityPub — the pod as a relay, the private half on your machine</title>
<desc id="dsc">The same two halves as the main architecture diagram, with the private half moved. The pod keeps what the ActivityPub protocol forces to be public: webfinger and host-meta at the host root, the actor document and public key, an inbox anyone may append to, public copies of the outbox, followers, following and notes, media, and nodeinfo. The outbox is paged to save load on the pod host. The pod keeps one private thing as well, the lease, because that is what stops two machines acting at once. The agent is local: it publishes the public face, signs and POSTs activities, collects and verifies the inbox, looks up handles by webfinger, serves a Mastodon-compatible client API with a client built in, and polls public hashtag timelines without the pod being involved. Everything else private is a local pod or a directory: notes, timeline, contacts, blocklist, client tokens, the Solid credential and the Fediverse signing key. A browser on your machine loads the client and the admin page from the agent. The agent publishes and drains against the remote pod and receives notification pushes from it.</desc>
