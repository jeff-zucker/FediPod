# Optional inbox gateway (see netlify/README.md). Un-deployed by default —
# nothing in FediPod publishes this; an operator deploys it themselves.
[build]
  functions = "netlify/functions"
  # The site is the browser app — the landing and sign-up page, the app, its
  # clients, the manage pages and the forum's page — staged from web/app into
  # web/app/site. A deploy from a clone is the same site fedipod.net serves.
  # The front's own pages stay under web/front, read by the function itself.
  command = "node scripts/stage-site.mjs"
  publish = "web/app/site"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"
  # front.mjs serves the signup page from the repo at cold start, and the
  # shapes the intake checks against are read from a file; the bundler only
  # ships what is named here.
  included_files = ["web/front/**", "lib/core/shapes/activitystreams.ttl"]
