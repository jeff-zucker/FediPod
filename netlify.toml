# Optional inbox gateway (see netlify/README.md). Un-deployed by default —
# nothing in FediPod publishes this; an operator deploys it themselves.
[build]
  functions = "netlify/functions"
  # Only the front pages are uploaded as statics; every route is answered by
  # the front function anyway.
  publish = "web/front"

[functions]
  node_bundler = "esbuild"
  # front.mjs serves the signup page from the repo at cold start, and the
  # shapes the intake checks against are read from a file; the bundler only
  # ships what is named here.
  included_files = ["web/front/**", "lib/core/shapes/activitystreams.ttl"]
