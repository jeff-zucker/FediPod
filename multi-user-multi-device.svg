<svg xmlns="http://www.w3.org/2000/svg" width="889" height="848" viewBox="0 0 889 848" role="img" aria-labelledby="ttl dsc">
<title id="ttl">FediPod — multi-user filter, multi-device agents</title>
<desc id="dsc">FediPod splits an ActivityPub account across three parties, with the fediverse — Mastodon, Bluesky, Lemmy, PeerTube, anyone else — above them all. Deliveries from the fediverse arrive first at fedipod.net, the shared filter: it verifies every delivery, drops the broadcast noise, and routes good mail into the right user's own pod inbox. It filters for many users and can act for none — keyless, a directory and a verifier, nothing more; each user's identity stays on their own pod. The pod is the discovery and storage part, and keeps what the protocol forces to be public: webfinger and host-meta at the host root, the actor document and public key, an inbox fed by the filter, public copies of the outbox, followers, following and notes, media, and nodeinfo. The outbox is paged to save load on the pod host. The pod also keeps the lease, because that is what stops two devices acting at once. Everything else private — notes, timeline, contacts, blocklist, client tokens, and the Fediverse signing key — lives on the pod too, so every device shares one copy; only the Solid credential stays on each machine. The agents are the behaviour part, one on any device you like, with the lease picking the actor: they publish the public face, sign and POST activities, collect and verify the inbox, look up handles by webfinger, serve a Mastodon-compatible client API with a client built in, and poll public hashtag timelines from their own instances. Each device's browser points at that device's own agent. The agents publish and drain against the pod and receive notification pushes from it.</desc>
