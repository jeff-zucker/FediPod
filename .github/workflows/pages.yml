# GitHub Pages for this repository, https://jeff-zucker.github.io/FediPod/:
# one page that sends its reader on to the fediverse-session demo, which its
# own repository publishes. The page and its stylesheet are the files below.
name: pages
on:
  push:
    branches: [main]
    paths: ['.github/pages/**', 'web/admin/tokens.css', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: assemble the site
        run: |
          mkdir -p site
          cp .github/pages/index.html site/
          cp web/admin/tokens.css site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
