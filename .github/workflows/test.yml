# Runs the offline smoke and the UI check on every push and pull request,
# and the Server's build and tests. Test only — no publish, no secrets, no deploy.
name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm test

  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/fedipod-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      # In a checkout the tests run against the checkout's own fedipod.
      - run: node scripts/link-fedipod.mjs
      - run: npm run build
      - run: node --test test/*.mjs
