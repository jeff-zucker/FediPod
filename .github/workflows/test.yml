# Runs the offline smoke, the UI check and the browser rigs on every push and
# pull request, and the packages built on fedipod (the Server, the forum, the
# session library) against this commit: npm test clones each one's main branch
# into .dependents/ and runs its tests. Test only — no publish, no secrets, no
# deploy.
name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm test
